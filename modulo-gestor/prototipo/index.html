/* Layout: trilho de navegação à esquerda (placa de rodovia) + área de trabalho; no celular vira abas roláveis no topo */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --sunken: #e9ede8;
  --ink: #18211d;
  --muted: #5a6862;
  --line: #d8dfd9;
  --accent: #0b6b4f;        /* verde de placa de rodovia */
  --accent-ink: #ffffff;
  --accent-soft: #dcefe6;
  --signal: #b77900;        /* âmbar de sinalização */
  --signal-soft: #fbefd2;
  --ok: #15803d; --ok-soft: #dcf3e3;
  --warn: #a15c00; --warn-soft: #fdf0d9;
  --danger: #b42318; --danger-soft: #fde4e1;
  --info: #1d5fa8; --info-soft: #e0ecfa;
  --shadow: 0 10px 30px rgba(20, 40, 30, .14);
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412; --surface: #171e1b; --sunken: #121815; --ink: #e5ebe7; --muted: #97a59e; --line: #2a3531;
    --accent: #3cbf8e; --accent-ink: #06140e; --accent-soft: #173a2d;
    --signal: #f0b43c; --signal-soft: #3a2d10;
    --ok: #4ade80; --ok-soft: #143222; --warn: #f5b04a; --warn-soft: #3a2a10;
    --danger: #f87171; --danger-soft: #3d1a17; --info: #7ab4f5; --info-soft: #172a40;
    --shadow: 0 10px 30px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412; --surface: #171e1b; --sunken: #121815; --ink: #e5ebe7; --muted: #97a59e; --line: #2a3531;
  --accent: #3cbf8e; --accent-ink: #06140e; --accent-soft: #173a2d;
  --signal: #f0b43c; --signal-soft: #3a2d10;
  --ok: #4ade80; --ok-soft: #143222; --warn: #f5b04a; --warn-soft: #3a2a10;
  --danger: #f87171; --danger-soft: #3d1a17; --info: #7ab4f5; --info-soft: #172a40;
  --shadow: 0 10px 30px rgba(0,0,0,.5);

}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--f-mono); font-size: .85em; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--accent); color: var(--accent-ink); padding: 20px 14px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px; }
.brand-mark { width: 34px; height: 34px; border: 2px solid currentColor; border-radius: 6px; display: grid; place-items: center; font-family: var(--f-display); font-size: 1.2rem; }
.brand-name { font-family: var(--f-display); font-size: 1.45rem; line-height: 1; }
.brand-sub { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 6px; font-weight: 500; }
.nav button:hover { background: color-mix(in srgb, var(--accent-ink) 12%, transparent); }
.nav button[aria-current="page"] { background: var(--accent-ink); color: var(--accent); font-weight: 600; }
.nav button:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 1px; }
.nav .count { font-family: var(--f-mono); font-size: .75rem; opacity: .85; }
.rail-foot { margin-top: auto; font-size: .78rem; opacity: .85; display: grid; gap: 8px; }
.rail-foot button { all: unset; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.main { min-width: 0; padding-inline: clamp(16px, 3vw, 40px); padding-block: 28px 60px; }
.page-head { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; margin-bottom: 22px; }
.page-head .eyebrow { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.page-head p.lede { color: var(--muted); max-width: 62ch; margin-top: 6px; }
.demo-flag { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; background: var(--signal-soft); color: var(--signal); padding: 3px 10px; border-radius: 999px; font-weight: 600; }

/* ---------- Components ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 4px 10px; font-size: .85rem; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.panel-body { padding: 16px; }
.stack { display: grid; gap: 20px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.kpi { background: var(--surface); padding: 14px 16px; display: grid; gap: 2px; }
.kpi .label { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kpi .value { font-family: var(--f-display); font-size: 2.1rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi .note { font-size: .82rem; color: var(--muted); }
.kpi.alert .value { color: var(--danger); }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--sunken); white-space: nowrap; }
tbody tr:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
tbody tr:last-child td { border-bottom: 0; }
td.right, th.right { text-align: right; }
tr.is-inactive td { color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: .78rem; font-weight: 600; white-space: nowrap; background: var(--sunken); color: var(--muted); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }

/* Nível territorial: placa com borda, lembra sinalização */
.lvl { display: inline-block; font-family: var(--f-display); font-size: .78rem; letter-spacing: .08em; padding: 1px 7px; border: 1.5px solid currentColor; border-radius: 3px; text-transform: uppercase; }
.lvl.PAIS { color: var(--info); } .lvl.ESTADO { color: var(--signal); } .lvl.MUNICIPIO { color: var(--accent); } .lvl.BAIRRO { color: var(--muted); }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { flex: 1 1 220px; min-width: 0; }
.field { display: grid; gap: 5px; min-width: 0; }
.field label, .field .lbl { font-size: .82rem; font-weight: 600; }
.field .hint { font-size: .78rem; color: var(--muted); }
.field .err { font-size: .8rem; color: var(--danger); }
input[type="text"], input[type="email"], input[type="number"], input[type="date"], input[type="time"], input[type="password"], input[type="search"], select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); min-width: 0;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
input[aria-invalid="true"] { border-color: var(--danger); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 7px 12px; cursor: pointer; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: .85rem; background: var(--surface); }

.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.callout { border: 1px solid var(--line); border-left: 4px solid var(--signal); background: var(--signal-soft); border-radius: 6px; padding: 10px 12px; font-size: .9rem; }
.callout.danger { border-left-color: var(--danger); background: var(--danger-soft); }
.callout.ok { border-left-color: var(--ok); background: var(--ok-soft); }

/* Autocomplete de território */
.ac { position: relative; }
.ac-list { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); max-height: 260px; overflow-y: auto; margin: 0; padding: 4px; list-style: none; }
.ac-list li { display: flex; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 4px; cursor: pointer; }
.ac-list li[aria-selected="true"], .ac-list li:hover { background: var(--accent-soft); }
.ac-list .path { color: var(--muted); font-size: .82rem; }

/* Cadeia de precedência do tempo */
.chain { display: grid; gap: 6px; }
.chain-step { display: grid; grid-template-columns: 110px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); }
.chain-step.hit { border: 1.5px solid var(--accent); background: var(--accent-soft); color: var(--ink); }
.chain-step.shadowed { opacity: .75; }
.chain-step .mins { font-family: var(--f-mono); }

/* Dialog */
dialog { border: 1px solid var(--line); border-radius: 10px; padding: 0; background: var(--surface); color: var(--ink); width: min(640px, calc(100vw - 32px)); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(10, 20, 15, .45); }
.dlg-head { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.dlg-body { padding: 18px; display: grid; gap: 14px; max-height: 70vh; overflow-y: auto; }
.dlg-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); right: 20px; left: auto; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 6px; box-shadow: var(--shadow); font-weight: 500; transform: translateY(20px); opacity: 0; transition: .2s; pointer-events: none; max-width: calc(100vw - 40px); }
.toast.show { transform: none; opacity: 1; }

.req-list { display: grid; gap: 0; }
.req { display: grid; grid-template-columns: 64px minmax(0,1fr) auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.req:last-child { border-bottom: 0; }
.req .id { font-family: var(--f-mono); font-size: .82rem; color: var(--accent); font-weight: 500; }
.req .src { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); white-space: nowrap; }

.bar { height: 8px; background: var(--sunken); border-radius: 4px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); }

@media (max-width: 980px) {
  .grid-3 { grid-template-columns: minmax(0,1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 10; padding: 10px 16px; gap: 8px; }
  .brand-sub, .rail-foot { display: none; }
  .nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; gap: 4px; }
  .nav button { white-space: nowrap; padding: 7px 10px; }
  .nav .count { display: none; }
  .grid-2 { grid-template-columns: minmax(0,1fr); }
  .form-grid { grid-template-columns: minmax(0,1fr); }
  .chain-step { grid-template-columns: 90px minmax(0,1fr) auto; }
  .req { grid-template-columns: 52px minmax(0,1fr); }
  .req .src { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }

   Utilitários
   ============================================================ */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const fmtDate = d => d ? d.split("-").reverse().join("/") : "—";
const fmtCep = c => c ? c.replace(/^(\d{5})(\d{3})$/, "$1-$2") : "—";
const fmtCpf = c => c ? c.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, "$1.$2.$3-$4") : "—";
const fmtMin = m => m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? String(m % 60).padStart(2, "0") : ""}` : `${m} min`;
const brl = v => Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const fmtInt = v => Number(v).toLocaleString("pt-BR");

const estado = id => ESTADOS.find(e => e.id === id);
const municipio = id => MUNICIPIOS.find(m => m.id === id);
const bairro = id => BAIRROS.find(b => b.id === id);
const func = id => S.funcionarios.find(f => f.id === id);
const loja = id => S.lojas.find(l => l.id === id);

// Hierarquia completa de um território: { nivel, pais, estado, municipio, bairro }
function hier(nivel, ref) {
  if (nivel === "PAIS") return { nivel, pais: 1058 };
  if (nivel === "ESTADO") return { nivel, pais: 1058, estado: ref };
  if (nivel === "MUNICIPIO") return { nivel, pais: 1058, estado: municipio(ref).estado, municipio: ref };
  const b = bairro(ref); return { nivel, pais: 1058, estado: municipio(b.municipio).estado, municipio: b.municipio, bairro: ref };
}
function terrName(nivel, ref) {
  if (nivel === "PAIS") return "Brasil";
  if (nivel === "ESTADO") { const e = estado(ref); return `${e.nome} (${e.uf})`; }
  if (nivel === "MUNICIPIO") { const m = municipio(ref); return `${m.nome} / ${estado(m.estado).uf}`; }
  const b = bairro(ref), m = municipio(b.municipio); return `${b.nome}, ${m.nome} / ${estado(m.estado).uf}`;
}
// Mesma regra do trigger fn_funcionario_territorio_validar
function overlaps(a, b) {
  if (a.nivel === "PAIS" || b.nivel === "PAIS") return true;
  if (a.estado !== b.estado) return false;
  if (a.nivel === "ESTADO" || b.nivel === "ESTADO") return true;
  if (a.municipio !== b.municipio) return false;
  if (a.nivel === "MUNICIPIO" || b.nivel === "MUNICIPIO") return true;
  return a.bairro === b.bairro;
}
const periodsOverlap = (i1, f1, i2, f2) => i1 <= (f2 || "9999-12-31") && i2 <= (f1 || "9999-12-31");
const isVigente = t => t.ini <= TODAY && (!t.fim || t.fim >= TODAY);
function findConflict(cand, ignoreId) {
  const h = hier(cand.nivel, cand.ref);
  return S.territorios.find(t => t.id !== ignoreId && periodsOverlap(t.ini, t.fim, cand.ini, cand.fim) && overlaps(h, hier(t.nivel, t.ref)));
}
function responsaveisMunicipio(mid) {
  const h = hier("MUNICIPIO", mid);
  return S.territorios.filter(t => isVigente(t) && overlaps(h, hier(t.nivel, t.ref)))
    .map(t => ({ t, f: func(t.func) }));
}
function qualificacao(l) {
  const n = l.marcas.filter(id => S.marcas.find(m => m.id === id)?.q).length;
  return n >= 3 ? "BEST" : n === 2 ? "VERY_GOOD" : n === 1 ? "GOOD" : "NAO_QUALIFICADA";
}
const qualPill = q => `<span class="pill ${QUAL[q][1]}">${QUAL[q][0]}</span>`;
function statusPill(cod) {
  const s = S.status.find(x => x.cod === cod);
  return s ? `<span class="pill ${s.cor}"><span class="dot"></span>${esc(s.desc)}</span>` : "—";
}
// Mesma regra de fn_tempo_atendimento
function resolveTempo(lojaId, funcId) {
  const l = loja(lojaId), m = municipio(l.mun);
  const target = { LOJA: l.id, FUNCIONARIO: funcId, BAIRRO: l.bairro, MUNICIPIO: l.mun, ESTADO: m.estado, GLOBAL: null };
  const steps = DIMS.map(dim => ({ dim, rule: S.tempos.find(t => t.dim === dim && (dim === "GLOBAL" || (target[dim] != null && t.ref === target[dim]))) }));
  const hit = steps.find(s => s.rule);
  return { steps, hit };
}
function tempoRefName(t) {
  switch (t.dim) {
    case "GLOBAL": return "Todas as visitas";
    case "ESTADO": case "MUNICIPIO": case "BAIRRO": return terrName(t.dim, t.ref);
    case "FUNCIONARIO": return func(t.ref)?.nome ?? "—";
    case "LOJA": { const l = loja(t.ref); return l ? `${l.nome} (${l.cod})` : "—"; }
  }
}

let toastTimer;
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

const dlg = $("#dlg");
function openDialog({ title, body, submitLabel = "Salvar", danger = false, onSubmit, onOpen }) {
  dlg.innerHTML = `<form method="dialog" id="dlgForm" novalidate>
    <div class="dlg-head"><h2>${esc(title)}</h2><button type="button" class="btn ghost sm" data-close aria-label="Fechar">Fechar</button></div>
    <div class="dlg-body">${body}<div id="dlgErr" class="callout danger" hidden></div></div>
    <div class="dlg-foot"><button type="button" class="btn" data-close>Cancelar</button>
    <button type="submit" class="btn ${danger ? "danger" : "primary"}">${esc(submitLabel)}</button></div></form>`;
  dlg.querySelectorAll("[data-close]").forEach(b => b.onclick = () => dlg.close());
  $("#dlgForm").onsubmit = e => {
    e.preventDefault();
    const err = onSubmit(new FormData(e.target), e.target);
    if (err) { const box = $("#dlgErr"); box.innerHTML = err; box.hidden = false; return; }
    dlg.close(); save(); render();
  };
  dlg.showModal();
  onOpen && onOpen(dlg);
}
function confirmDialog(title, text, label, fn) {
  openDialog({ title, body: `<p>${text}</p>`, submitLabel: label, danger: true, onSubmit: () => { fn(); } });
}

function saveFunc(fd, id) {
  const d = Object.fromEntries(fd);
  d.cpf = d.cpf.replace(/\D/g, ""); d.cep = d.cep.replace(/\D/g, "");
  const errs = [];
  if (!d.nome.trim()) errs.push("Informe o nome.");
  if (d.cpf && d.cpf.length !== 11) errs.push("O CPF precisa ter 11 dígitos.");
  if (!/^\S+@\S+\.\S+$/.test(d.email)) errs.push("Informe um e-mail válido.");
  if (d.cep && d.cep.length !== 8) errs.push("O CEP precisa ter 8 dígitos.");
  if (S.funcionarios.some(f => f.id !== id && f.email.toLowerCase() === d.email.toLowerCase())) errs.push("Já existe um funcionário com esse e-mail.");
  if (d.cpf && S.funcionarios.some(f => f.id !== id && f.cpf === d.cpf)) errs.push("Já existe um funcionário com esse CPF.");
  if (errs.length) return errs.join("<br>");
  if (id) { Object.assign(func(id), d); toast("Funcionário atualizado"); }
  else { S.funcionarios.push({ id: nextId(S.funcionarios), ativo: true, ...d }); toast("Funcionário cadastrado"); }
}

  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
    const f = func(+b.dataset.edit);
    openDialog({ title: `Editar ${f.nome}`, body: funcForm(f), onSubmit: fd => saveFunc(fd, f.id) });
  });
  document.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => {
    const f = func(+b.dataset.toggle);
    if (!f.ativo) { f.ativo = true; save(); render(); toast(`${f.nome} reativado`); return; }
    const ts = S.territorios.filter(t => t.func === f.id && isVigente(t));
    confirmDialog(`Inativar ${f.nome}?`,
      `O funcionário perde o acesso ao aplicativo.${ts.length ? ` ${ts.length} território(s) vigente(s) serão encerrados hoje e os municípios ficarão sem vendedor até nova atribuição.` : ""}`,
      "Inativar", () => { f.ativo = false; ts.forEach(t => t.fim = TODAY); toast(`${f.nome} inativado`); });
  });
}

function openTerritoryDialog(pre = {}) {
  const reps = S.funcionarios.filter(f => f.ativo);
  let chosen = pre.nivel ? { nivel: pre.nivel, ref: pre.ref } : null;
  openDialog({
    title: "Atribuir território", submitLabel: "Atribuir",
    body: `
      <div class="field"><label for="t_func">Funcionário</label><select id="t_func" name="func" required><option value="">Selecione</option>${reps.map(f => `<option value="${f.id}">${esc(f.nome)} · ${PERFIL[f.perfil]}</option>`).join("")}</select></div>
      <div class="field"><span class="lbl" id="t_nivel_lbl">Nível</span>
        <div class="seg" role="group" aria-labelledby="t_nivel_lbl" id="t_nivel"><button type="button" data-n="" aria-pressed="true">Todos</button>${NIVEIS.map(n => `<button type="button" data-n="${n}" aria-pressed="false">${NIVEL_LABEL[n]}</button>`).join("")}</div></div>
      <div class="field ac"><label for="t_q">Território</label>
        <input type="text" id="t_q" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="t_list" placeholder="Digite o nome do estado, município ou bairro" value="${chosen ? esc(terrName(chosen.nivel, chosen.ref)) : ""}">
        <ul class="ac-list" id="t_list" role="listbox" hidden></ul>
        <span class="hint">Exemplos: "Itaboraí", "Boa Viagem", "Pernambuco".</span></div>
      <div id="t_check"></div>
      <div class="form-grid">
        <div class="field"><label for="t_ini">Início da vigência</label><input type="date" id="t_ini" name="ini" value="${TODAY}"></div>
        <div class="field"><label for="t_fim">Fim (opcional)</label><input type="date" id="t_fim" name="fim"><span class="hint">Vazio = por tempo indeterminado.</span></div>
      </div>`,
    onOpen: () => {
      const opts = territoryOptions();
      let nivel = "", active = -1, shown = [];
      const q = $("#t_q"), ul = $("#t_list");
      const check = () => {
        const box = $("#t_check");
        if (!chosen) { box.innerHTML = ""; return; }
        const c = findConflict({ ...chosen, ini: $("#t_ini").value, fim: $("#t_fim").value || null });
        const fsel = +$("#t_func").value;
        box.innerHTML = c
          ? `<div class="callout danger"><strong>Sobreposição.</strong> ${esc(terrName(chosen.nivel, chosen.ref))} ${c.func === fsel ? "já está coberto por outro território deste funcionário" : `conflita com ${esc(terrName(c.nivel, c.ref))}, de ${esc(func(c.func).nome)}`} (${fmtDate(c.ini)} a ${c.fim ? fmtDate(c.fim) : "indeterminado"}).</div>`
          : `<div class="callout ok">${esc(terrName(chosen.nivel, chosen.ref))} está livre no período.</div>`;
      };
      const draw = () => {
        const s = norm(q.value.trim());
        shown = opts.filter(o => (!nivel || o.nivel === nivel) && (!s || norm(o.label).includes(s))).slice(0, 30);
        ul.innerHTML = shown.length ? shown.map((o, i) => `<li role="option" id="t_o${i}" data-i="${i}" aria-selected="${i === active}"><span class="lvl ${o.nivel}">${NIVEL_LABEL[o.nivel]}</span><span>${esc(o.label)} <span class="path">${esc(o.path)}</span></span></li>`).join("") : '<li class="muted" aria-disabled="true">Nada encontrado</li>';
        ul.hidden = false; q.setAttribute("aria-expanded", "true");
        ul.querySelectorAll("li[data-i]").forEach(li => li.onmousedown = e => { e.preventDefault(); pick(shown[+li.dataset.i]); });
      };
      const pick = o => { chosen = { nivel: o.nivel, ref: o.ref }; q.value = terrName(o.nivel, o.ref); ul.hidden = true; q.setAttribute("aria-expanded", "false"); check(); };
      q.oninput = () => { chosen = null; active = -1; draw(); check(); };
      q.onfocus = draw;
      q.onblur = () => setTimeout(() => { ul.hidden = true; q.setAttribute("aria-expanded", "false"); }, 120);
      q.onkeydown = e => {
        if (e.key === "ArrowDown") { active = Math.min(active + 1, shown.length - 1); draw(); e.preventDefault(); }
        else if (e.key === "ArrowUp") { active = Math.max(active - 1, 0); draw(); e.preventDefault(); }
        else if (e.key === "Enter" && active >= 0 && !ul.hidden) { pick(shown[active]); e.preventDefault(); }
        else if (e.key === "Escape" && !ul.hidden) { ul.hidden = true; e.stopPropagation(); e.preventDefault(); }
      };
      $("#t_nivel").querySelectorAll("button").forEach(b => b.onclick = () => {
        nivel = b.dataset.n; $("#t_nivel").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); q.focus();
      });
      ["#t_ini", "#t_fim", "#t_func"].forEach(s => $(s).onchange = check);
      check();
    },
    onSubmit: fd => {
      const f = +fd.get("func"), ini = fd.get("ini"), fim = fd.get("fim") || null;
      if (!f) return "Selecione o funcionário.";
      if (!chosen) return "Escolha um território da lista de sugestões.";
      if (!ini) return "Informe o início da vigência.";
      if (fim && fim < ini) return "O fim da vigência não pode ser anterior ao início.";
      const c = findConflict({ ...chosen, ini, fim });
      if (c) return `Não é possível atribuir: ${esc(terrName(c.nivel, c.ref))} já está com ${esc(func(c.func).nome)} no período. Encerre esse vínculo ou escolha outra área.`;
      S.territorios.push({ id: nextId(S.territorios), func: f, nivel: chosen.nivel, ref: chosen.ref, ini, fim });
      toast(`${terrName(chosen.nivel, chosen.ref)} atribuído a ${func(f).nome}`);
    }
  });
}

        <div class="panel-body" style="display:grid;gap:10px">${OPEN_Q.map(q => `<div class="callout">${esc(q)}</div>`).join("")}</div></section>
      <section class="panel"><div class="panel-head"><h2>Fora desta entrega</h2></div>
        <div class="panel-body"><p class="muted">Motor de roteirização, check-in por GPS, cronômetro de atendimento com lançamento manual, registro da visita, gravação de áudio, painéis demográficos e relatórios de ROI. Entram nas próximas iterações, sobre os cadastros deste módulo.</p></div></section>
    </div>
  </div>`;
}
function bindRequisitos() { document.querySelectorAll("[data-goto]").forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.goto); }); }

/* ============================================================
   Render
   ============================================================ */
const VIEWS = {
  visao: [pageVisao, () => document.querySelectorAll("[data-assign]").forEach(b => b.onclick = () => openTerritoryDialog({ nivel: "MUNICIPIO", ref: +b.dataset.assign }))],
  funcionarios: [pageFuncionarios, bindFuncionarios], territorios: [pageTerritorios, bindTerritorios], lojas: [pageLojas, bindLojas],
  tempo: [pageTempo, bindTempo], status: [pageStatus, bindStatus], parametros: [pageParametros, bindParametros], requisitos: [pageRequisitos, bindRequisitos]
};
function render() {
  renderNav();
  const [view, bind] = VIEWS[page];
  $("#main").innerHTML = view();
  bind();
}
$("#resetBtn").onclick = () => confirmDialog("Restaurar dados de exemplo?", "Todas as alterações feitas neste navegador serão descartadas.", "Restaurar", () => { S = seed(); toast("Dados de exemplo restaurados"); });
render();
</script>
